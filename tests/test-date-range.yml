name: Test contributor report with date range
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run contributors action with date range
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: github-community-projects/contributors
          START_DATE: "2023-01-01"
          END_DATE: "2023-12-31"
          OUTPUT_FILENAME: contributors-dated.md

      - name: Assert dated output file was created
        run: |
          echo "Checking for contributors-dated.md output file..."
          if [ ! -f "$GITHUB_WORKSPACE/contributors-dated.md" ]; then
            echo "FAIL: contributors-dated.md output file was not created"
            exit 1
          fi
          echo "PASS: contributors-dated.md file exists"

      - name: Assert output file contains date range information
        run: |
          echo "Checking contents of contributors-dated.md..."
          cat "$GITHUB_WORKSPACE/contributors-dated.md"
          # The report should mention the date range when dates are provided
          if ! grep -q "2023-01-01" "$GITHUB_WORKSPACE/contributors-dated.md"; then
            echo "FAIL: contributors-dated.md does not contain the start date 2023-01-01"
            exit 1
          fi
          echo "PASS: contributors-dated.md contains date range information"
