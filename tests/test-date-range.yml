name: Test date range filtering
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run contributors action with date range
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: github-community-projects/contributors
          START_DATE: "2023-01-01"
          END_DATE: "2023-12-31"
          OUTPUT_FILENAME: contributors-dated.md

      - name: Assert dated output file was created
        run: |
          echo "Checking for contributors-dated.md..."
          if [ ! -f "$GITHUB_WORKSPACE/contributors-dated.md" ]; then
            echo "FAIL: contributors-dated.md was not created"
            ls -la "$GITHUB_WORKSPACE/"
            exit 1
          fi
          echo "PASS: contributors-dated.md exists"
          echo "--- File contents (first 50 lines) ---"
          head -50 "$GITHUB_WORKSPACE/contributors-dated.md"

      - name: Assert output contains date range information
        run: |
          echo "Checking contributors-dated.md for date range..."
          if ! grep -q "2023-01-01" "$GITHUB_WORKSPACE/contributors-dated.md"; then
            echo "FAIL: contributors-dated.md does not contain start date 2023-01-01"
            cat "$GITHUB_WORKSPACE/contributors-dated.md"
            exit 1
          fi
          echo "PASS: contributors-dated.md contains date range information"
