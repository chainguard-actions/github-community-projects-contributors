name: Test basic contributors action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke contributors action
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify action was invoked
        run: |
          # The action may fail without a real GitHub token or org/repo config,
          # but we verify it was invoked (outcome is set to success or failure, not skipped)
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"

      - name: Verify action.yml exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found in workspace"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Verify action uses docker runner
        run: |
          RUNNER=$(grep 'using:' "$GITHUB_WORKSPACE/action.yml" | head -1 | awk '{print $2}' | tr -d '"')
          echo "runner: $RUNNER"
          if [ "$RUNNER" != "docker" ]; then
            echo "FAIL: expected docker runner, got '$RUNNER'"
            exit 1
          fi
          echo "PASS: action uses docker runner"
