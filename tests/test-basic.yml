name: Test basic contributors report for a repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Contributors Action on a public repository
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: github-community-projects/contributors
          START_DATE: "2024-01-01"
          END_DATE: "2024-01-31"
      - name: Assert action completed without error
        run: |
          echo "Contributors action completed successfully"
          echo "PASS"
