name: Test custom output filename
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run contributors action with custom output filename
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: github-community-projects/contributors
          OUTPUT_FILENAME: my-report.md

      - name: Assert custom output file was created
        run: |
          echo "Checking for my-report.md..."
          if [ ! -f "$GITHUB_WORKSPACE/my-report.md" ]; then
            echo "FAIL: my-report.md was not created"
            ls -la "$GITHUB_WORKSPACE/"
            exit 1
          fi
          echo "PASS: my-report.md exists"
          echo "--- File contents (first 30 lines) ---"
          head -30 "$GITHUB_WORKSPACE/my-report.md"

      - name: Assert default output file was NOT created
        run: |
          echo "Checking that contributors.md was NOT created..."
          if [ -f "$GITHUB_WORKSPACE/contributors.md" ]; then
            echo "FAIL: contributors.md was created when OUTPUT_FILENAME=my-report.md"
            exit 1
          fi
          echo "PASS: contributors.md was not created (correct)"
