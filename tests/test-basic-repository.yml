name: Test basic repository usage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run contributors action on a single repository
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: github-community-projects/contributors
          OUTPUT_FILENAME: contributors.md

      - name: Assert output file was created
        run: |
          echo "Checking for contributors.md..."
          if [ ! -f "$GITHUB_WORKSPACE/contributors.md" ]; then
            echo "FAIL: contributors.md was not created"
            exit 1
          fi
          echo "PASS: contributors.md exists"
          echo "--- File contents (first 50 lines) ---"
          head -50 "$GITHUB_WORKSPACE/contributors.md"

      - name: Assert output file contains expected content
        run: |
          echo "Checking contributors.md content..."
          if ! grep -qi "contributor" "$GITHUB_WORKSPACE/contributors.md"; then
            echo "FAIL: contributors.md does not contain 'contributor'"
            cat "$GITHUB_WORKSPACE/contributors.md"
            exit 1
          fi
          echo "PASS: contributors.md contains expected content"
